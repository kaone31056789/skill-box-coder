name: genesis

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis
    ports: ["5432:5432"]
    volumes: ["genesis_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Built, not run as a service: the API shells out to `docker run` per
  # experiment so each execution gets a fresh, isolated container.
  sandbox:
    build:
      context: ../sandbox
    image: genesis-sandbox:latest
    profiles: ["build-only"]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://genesis:genesis@db:5432/genesis
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-auto}
      CORS_ORIGINS: http://localhost:3000
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      # Lets the API launch sibling sandbox containers. This grants the API
      # container control of the host daemon -- acceptable for local dev only.
      # Never mount this in a shared or production environment.
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  genesis_pgdata:
